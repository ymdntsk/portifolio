<!-- Seção de Contato -->
<section id="contato" style="padding:40px 20px;">
  <div class="contact-wrapper">
    <h2>Contato</h2>

    <form class="contact-form" action="#" method="post">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="seu@exemplo.com" required>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem..."></textarea>

      <button type="submit" class="submit-btn .poppins-regular">Enviar</button>
    </form>
  </div>
</section>

</body>
